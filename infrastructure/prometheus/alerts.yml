groups:
  - name: securebank
    rules:
      - alert: SecureBankUnavailable
        expr: up{job="securebank"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: 'SecureBank API metrics are unavailable' }
      - alert: EventDeliveryDelayed
        expr: securebank_outbox_oldest_seconds > 60
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'Committed events have waited over a minute for publication' }
      - alert: ConsumerBacklog
        expr: securebank_kafka_lag > 100
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'A SecureBank consumer group is behind' }
      - alert: ConsumerLagUnavailable
        expr: securebank_kafka_lag < 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: 'Consumer lag could not be measured' }
      - alert: ParkedSecurityEmail
        expr: securebank_mail_dead > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'A security email exhausted its delivery attempts' }
      - alert: MetricsSnapshotStale
        expr: time() - securebank_snapshot_timestamp > 60
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Banking metrics sampling is stale' }
      - alert: ApiErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'API server errors exceed five percent' }
      - alert: ConnectionPoolBusy
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'The database connection pool is near capacity' }
