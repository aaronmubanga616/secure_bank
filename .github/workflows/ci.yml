name: SecureBank checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:toolchain
      - run: npm run security:check
      - run: npm run build
      - run: npm run build:mobile
      - run: npx expo install --check
        working-directory: apps/mobile
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B -ntp -s .mvn/settings.xml clean verify
        working-directory: backend
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/setup-env.mjs
      - name: Enable the disposable test administrator
        run: node scripts/enable-test-admin.mjs
      - run: docker compose --profile monitoring up -d --build
      - run: node scripts/wait-for-stack.mjs
      - name: Customer and staff browser journeys
        run: npm run test:e2e
        env:
          WEB_URL: http://localhost:8088
          ADMIN_URL: http://localhost:8089
      - run: npm run test:performance
      - run: node --env-file=.env scripts/check-monitoring.mjs
      # Browser traces, screenshots and .local contain session data: never upload them.
      - name: Stop the disposable stack
        if: always()
        run: docker compose --profile monitoring down
